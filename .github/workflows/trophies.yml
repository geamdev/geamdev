name: Generate Trophies

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Download trophies SVG
        run: |
          curl -f "https://github-profile-trophy.vercel.app/?username=geamdev&theme=darkhub&no-frame=true&no-bg=true&column=7&margin-w=8" \
            -o profile/trophies.svg \
            --retry 3 \
            --retry-delay 5

      - name: Commit trophies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophies.svg
          git commit -m "Update trophies" || echo "No changes to commit"
          git push
